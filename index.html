<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8fcf6f">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>ピアノ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- アニメ風の背景 -->
  <svg id="scene" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="forestBg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#d9f2b4"/><stop offset=".45" stop-color="#b7e39a"/><stop offset="1" stop-color="#7fc66a"/>
      </linearGradient>
      <linearGradient id="rayG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fffbe0" stop-opacity=".85"/><stop offset="1" stop-color="#fffbe0" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="appleG" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#ff8a80"/><stop offset="1" stop-color="#e53935"/></radialGradient>
    </defs>
    <rect width="1600" height="700" fill="url(#forestBg)"/>
    <!-- 木もれ日 -->
    <g class="rays">
      <polygon class="ray r1" points="380,0 470,0 640,700 470,700" fill="url(#rayG)"/>
      <polygon class="ray r2" points="900,0 960,0 1080,700 960,700" fill="url(#rayG)"/>
      <polygon class="ray r3" points="1250,0 1330,0 1480,700 1330,700" fill="url(#rayG)"/>
    </g>
    <!-- 奥の木 -->
    <g fill="#8fbf6e" opacity=".55">
      <rect x="120" y="60" width="34" height="640" rx="14"/><rect x="330" y="90" width="26" height="610" rx="12"/>
      <rect x="720" y="70" width="30" height="630" rx="13"/><rect x="1180" y="80" width="28" height="620" rx="12"/>
      <rect x="1430" y="50" width="36" height="650" rx="15"/>
    </g>
    <!-- 手前の木（左右のはし） -->
    <g fill="#9a6a44"><rect x="10" y="120" width="70" height="580" rx="20"/><rect x="1520" y="110" width="70" height="590" rx="20"/></g>
    <!-- 上の木の葉（ゆれる） -->
    <g class="canopy">
      <g fill="#4f9e3f">
        <circle cx="40" cy="20" r="120"/><circle cx="240" cy="-10" r="110"/><circle cx="430" cy="-30" r="100"/><circle cx="650" cy="-50" r="100"/>
        <circle cx="950" cy="-50" r="100"/><circle cx="1180" cy="-30" r="100"/><circle cx="1380" cy="-10" r="110"/><circle cx="1570" cy="20" r="120"/>
      </g>
      <g fill="#6bbd53">
        <circle cx="130" cy="-20" r="90"/><circle cx="340" cy="-40" r="80"/><circle cx="800" cy="-75" r="100"/>
        <circle cx="1270" cy="-40" r="80"/><circle cx="1480" cy="-20" r="90"/>
      </g>
      <g fill="#86d16a" opacity=".9">
        <circle cx="90" cy="-50" r="50"/><circle cx="520" cy="-70" r="55"/><circle cx="1080" cy="-70" r="55"/><circle cx="1520" cy="-50" r="50"/>
      </g>
    </g>
    <!-- りんごの枝（さわれる） -->
    <g class="item apple" data-react="apple">
      <g class="inner">
        <path d="M430 -10 Q520 70 610 80" stroke="#8a5a36" stroke-width="12" fill="none" stroke-linecap="round"/>
        <g fill="#5fb04a"><ellipse cx="500" cy="60" rx="34" ry="20" transform="rotate(-25 500 60)"/><ellipse cx="575" cy="95" rx="30" ry="18" transform="rotate(20 575 95)"/><ellipse cx="610" cy="60" rx="28" ry="16" transform="rotate(-10 610 60)"/></g>
        <g class="apples">
          <circle cx="560" cy="122" r="40" fill="url(#appleG)"/>
          <ellipse cx="546" cy="106" rx="10" ry="7" fill="#fff" opacity=".7" transform="rotate(-30 546 106)"/>
          <path d="M560 84 q2 -12 6 -18" stroke="#6b4423" stroke-width="5" fill="none" stroke-linecap="round"/>
          <ellipse cx="578" cy="74" rx="14" ry="7" fill="#5fb04a" transform="rotate(-25 578 74)"/>
        </g>
      </g>
    </g>
    <!-- 小鳥（さわれる） -->
    <g class="item bird" data-react="bird">
      <path d="M890 -10 Q905 60 895 150 M895 150 Q970 165 1050 135" stroke="#6b8f3a" stroke-width="7" fill="none" stroke-linecap="round"/>
      <g transform="translate(-506 -48) scale(1.35)">
        <g class="inner">
          <ellipse cx="1090" cy="115" rx="34" ry="30" fill="#5ec0f2"/>
          <ellipse cx="1098" cy="124" rx="20" ry="16" fill="#fff6d6"/>
          <path class="wingL" d="M1064 112 q-22 6 -16 26 q16 -4 24 -18z" fill="#3a9fd8"/>
          <circle cx="1104" cy="104" r="6" fill="#2b2b33"/><circle cx="1106" cy="102" r="2" fill="#fff"/>
          <path d="M1122 110 l18 6 l-18 6z" fill="#ffb300"/>
          <circle cx="1098" cy="118" r="5" fill="#ff9aa8" opacity=".7"/>
          <path d="M1060 96 q-10 -20 6 -22 q2 10 -6 22z" fill="#3a9fd8"/>
        </g>
      </g>
    </g>
    <!-- ちょうちょ（とびまわる・さわれる） -->
    <g class="fly f1"><g class="bob"><g class="item bfly" data-react="bfly"><g class="inner">
      <g class="wings"><path d="M0 0 C-30 -40 -60 -10 -34 14 C-22 24 -6 10 0 0z" fill="#ff8fc0"/><path d="M0 0 C30 -40 60 -10 34 14 C22 24 6 10 0 0z" fill="#ff8fc0"/>
      <circle cx="-26" cy="-6" r="6" fill="#fff" opacity=".7"/><circle cx="26" cy="-6" r="6" fill="#fff" opacity=".7"/></g>
      <ellipse cx="0" cy="4" rx="4" ry="14" fill="#5a3a4a"/><circle cx="0" cy="-10" r="10" fill="none" stroke="transparent" stroke-width="40"/></g></g></g></g>
    <g class="fly f2"><g class="bob"><g class="item bfly" data-react="bfly"><g class="inner">
      <g class="wings"><path d="M0 0 C-30 -40 -60 -10 -34 14 C-22 24 -6 10 0 0z" fill="#ffd54d"/><path d="M0 0 C30 -40 60 -10 34 14 C22 24 6 10 0 0z" fill="#ffd54d"/>
      <circle cx="-26" cy="-6" r="6" fill="#fff" opacity=".7"/><circle cx="26" cy="-6" r="6" fill="#fff" opacity=".7"/></g>
      <ellipse cx="0" cy="4" rx="4" ry="14" fill="#5a3a4a"/><circle cx="0" cy="-10" r="10" fill="none" stroke="transparent" stroke-width="40"/></g></g></g></g>
    <!-- ひらひら落ちる葉っぱ -->
    <g class="leaves" fill="#7cc85e">
      <path class="lf l1" d="M0 0 q14 -14 28 0 q-14 14 -28 0z"/><path class="lf l2" d="M0 0 q14 -14 28 0 q-14 14 -28 0z" fill="#f2b84b"/>
      <path class="lf l3" d="M0 0 q14 -14 28 0 q-14 14 -28 0z"/><path class="lf l4" d="M0 0 q14 -14 28 0 q-14 14 -28 0z" fill="#9bd77a"/>
      <path class="lf l5" d="M0 0 q14 -14 28 0 q-14 14 -28 0z" fill="#e8964a"/>
    </g>
    <!-- 地面 -->
    <path d="M0 560 Q400 500 800 560 T1600 540 V700 H0Z" fill="#6cbf55"/>
    <g><circle cx="60" cy="600" r="10" fill="#ff7eb6"/><circle cx="1540" cy="590" r="10" fill="#ffe14d"/>
      <path d="M30 640 q20 -40 40 0z" fill="#e53935"/><circle cx="42" cy="630" r="3" fill="#fff"/><circle cx="56" cy="626" r="3" fill="#fff"/><rect x="45" y="638" width="10" height="16" fill="#fff3e0"/></g>
  </svg>

  <!-- 上の帯 -->
  <header id="top">
    <div class="left">
      <button id="songBtn" class="pill big">🎵 <span data-i18n="songs">うた</span></button>
      <button id="stopBtn" class="pill big red hidden">⏹ <span data-i18n="stop">やめる</span></button>
      <button id="alongBtn" class="pill toggle" aria-pressed="false">🎶 <span data-i18n="along">いっしょに</span></button>
      <div class="seg small" id="speedSeg">
        <button data-v="0.7" data-i18n-aria="slow" aria-label="ゆっくり">🐢</button>
        <button data-v="1" data-i18n-aria="normal" aria-label="ふつう">🚶</button>
        <button data-v="1.3" data-i18n-aria="fast" aria-label="はやい">🐇</button>
      </div>
    </div>
    <div id="buddy" role="button" aria-label="くまさん">
        <svg viewBox="0 0 120 120">
          <circle cx="28" cy="30" r="18" fill="#c98b5a"/><circle cx="92" cy="30" r="18" fill="#c98b5a"/>
          <circle cx="28" cy="30" r="9" fill="#f0c49a"/><circle cx="92" cy="30" r="9" fill="#f0c49a"/>
          <circle cx="60" cy="66" r="46" fill="#d99a66"/>
          <ellipse cx="60" cy="82" rx="22" ry="17" fill="#f6dcc0"/>
          <g class="eyes"><ellipse cx="42" cy="60" rx="6" ry="8" fill="#3a2a20"/><ellipse cx="78" cy="60" rx="6" ry="8" fill="#3a2a20"/>
          <circle cx="44" cy="57" r="2.2" fill="#fff"/><circle cx="80" cy="57" r="2.2" fill="#fff"/></g>
          <g class="happyEyes" stroke="#3a2a20" stroke-width="4" fill="none" stroke-linecap="round"><path d="M35 62 Q42 53 49 62"/><path d="M71 62 Q78 53 85 62"/></g>
          <ellipse cx="60" cy="75" rx="7" ry="5" fill="#3a2a20"/>
          <path d="M51 86 Q60 95 69 86" stroke="#3a2a20" stroke-width="3" fill="none" stroke-linecap="round"/>
          <circle cx="30" cy="78" r="7" fill="#ff9aa8" opacity=".7"/><circle cx="90" cy="78" r="7" fill="#ff9aa8" opacity=".7"/>
        </svg>
    </div>
    <div class="right">
      <div id="now" class="hidden"><span id="nowEmoji"></span><span id="nowTitle"></span><div id="bar"><div id="barFill"></div><span id="barGoal">🏁</span><span id="barRunner"></span></div></div>
      <div id="flags" role="group" aria-label="ことば / Language / 語言">
        <button class="flag" data-lang="en" aria-label="English">
          <svg viewBox="0 0 40 40"><defs><clipPath id="ce"><circle cx="20" cy="20" r="18"/></clipPath></defs>
            <g clip-path="url(#ce)"><rect width="40" height="40" fill="#fff"/>
              <g fill="#e8384f"><rect y="2" width="40" height="4"/><rect y="10" width="40" height="4"/><rect y="18" width="40" height="4"/><rect y="26" width="40" height="4"/><rect y="34" width="40" height="4"/></g>
              <rect width="20" height="22" fill="#3c5bd6"/>
              <g fill="#fff"><circle cx="5" cy="5" r="1.4"/><circle cx="11" cy="5" r="1.4"/><circle cx="17" cy="5" r="1.4"/><circle cx="8" cy="10" r="1.4"/><circle cx="14" cy="10" r="1.4"/><circle cx="5" cy="15" r="1.4"/><circle cx="11" cy="15" r="1.4"/><circle cx="17" cy="15" r="1.4"/></g></g>
            <circle cx="20" cy="20" r="18" fill="none" stroke="#dfe4f5" stroke-width="2"/>
            <circle cx="28" cy="10" r="2.5" fill="#fff" opacity=".8"/></svg>
        </button>
        <button class="flag" data-lang="ja" aria-label="にほんご">
          <svg viewBox="0 0 40 40"><defs><clipPath id="cj"><circle cx="20" cy="20" r="18"/></clipPath></defs>
            <g clip-path="url(#cj)"><rect width="40" height="40" fill="#fff"/><circle cx="20" cy="20" r="8" fill="#e8384f"/></g>
            <circle cx="20" cy="20" r="18" fill="none" stroke="#f1d9de" stroke-width="2"/>
            <circle cx="11" cy="11" r="3" fill="#fff" opacity=".9"/></svg>
        </button>
        <button class="flag" data-lang="zh" aria-label="中文（繁體）">
          <svg viewBox="0 0 40 40"><defs><radialGradient id="zg" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ff7b7b"/><stop offset="1" stop-color="#e8384f"/></radialGradient></defs>
            <circle cx="20" cy="20" r="18" fill="url(#zg)"/>
            <circle cx="20" cy="20" r="18" fill="none" stroke="#ffd84d" stroke-width="2.5"/>
            <text x="20" y="27.5" text-anchor="middle" font-size="21" font-weight="900" fill="#fff" font-family="sans-serif">中</text>
            <circle cx="11" cy="10" r="2.6" fill="#fff" opacity=".85"/></svg>
        </button>
      </div>
      <button id="lockBtn" class="pill" aria-label="ロック（ながおし）"><span class="ring"></span><span class="ic">🔓</span></button>
      <button id="setBtn" class="pill" aria-label="せってい（ながおし）">⚙</button>
    </div>
  </header>

  <div id="sunFx"></div>

  <!-- 鍵盤 -->
  <main id="kbWrap"><div id="kb"></div><div id="fx"></div></main>

  <!-- うたをえらぶ -->
  <div id="picker" class="overlay hidden">
    <div class="panel">
      <h2 data-i18n="pick">🎵 どの うたに する？</h2>
      <div id="songGrid"></div>
      <button class="close pill" data-close>✕</button>
    </div>
  </div>

  <!-- できたね -->
  <div id="done" class="overlay hidden">
    <div class="rays"></div>
    <div id="fireworks"></div>
    <div class="panel done">
      <div class="medal">🏅</div>
      <h2 id="doneTitle"></h2>
      <p id="doneSong"></p>
      <p class="stamps">🌟 <span data-i18n="stamps">スタンプ</span> × <b id="stampCount">0</b></p>
      <div class="row">
        <button id="againBtn" class="pill big">🔁 <span data-i18n="again">もういちど</span></button>
        <button id="otherBtn" class="pill big">🎵 <span data-i18n="other">ほかの うた</span></button>
        <button class="pill big" data-close>🎹 <span data-i18n="free">じゆうに ひく</span></button>
      </div>
    </div>
    <div id="confetti"></div>
  </div>

  <!-- おとな用のせってい（⚙をながおし） -->
  <div id="settings" class="overlay hidden">
    <div class="panel sheet">
      <h2 data-i18n="settings">せってい（おとなよう）</h2>
      <div class="line vol"><span data-i18n="volume">音量</span>
        <div class="volBox"><span class="vi">🔈</span>
          <div id="volSlider" role="slider" aria-valuemin="10" aria-valuemax="100" tabindex="0">
            <div id="volFill"></div><div id="volKnob"></div>
          </div><span class="vi">🔊</span></div></div>
      <label class="line"><span data-i18n="labels">鍵盤に ドレミ を表示</span><input id="labels" type="checkbox"></label>
      <label class="line"><span data-i18n="guide">「いっしょに」でお手本の音を鳴らす</span><input id="guide" type="checkbox"></label>
      <p class="note" data-i18n-html="help"></p>
      <p class="credit"><span data-i18n="soundby">ピアノの音</span>：Salamander Grand Piano V3（Alexander Holm, CC BY 3.0）<br>ピアノ v<span id="ver"></span></p>
      <button class="pill big" data-close data-i18n="close">とじる</button>
    </div>
  </div>

  <div id="loading"><div>🎹</div><p data-i18n="loading">じゅんび ちゅう…</p></div>
  <div id="toast"></div>
</div>
<script src="app.js"></script>
</body>
</html>
