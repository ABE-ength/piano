<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1b1f">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>ピアノ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="bar">
  <div class="grp">
    <button id="octDown" class="btn" aria-label="低い音へ">◀</button>
    <span id="range" class="range">C3–C5</span>
    <button id="octUp" class="btn" aria-label="高い音へ">▶</button>
  </div>
  <div class="grp">
    <button id="keysLess" class="btn" aria-label="鍵盤を減らす">−</button>
    <span class="lbl">鍵盤</span>
    <button id="keysMore" class="btn" aria-label="鍵盤を増やす">＋</button>
  </div>
  <button id="pedal" class="btn wide" aria-pressed="false">ペダル</button>
  <div class="grp">
    <button id="rec" class="btn wide">● 録音</button>
    <button id="play" class="btn wide">▶ 再生</button>
    <button id="list" class="btn" aria-label="録音一覧">☰</button>
  </div>
  <button id="settings" class="btn" aria-label="設定">⚙</button>
</header>

<div id="mapWrap" aria-label="表示する音域（ドラッグで移動）">
  <canvas id="map"></canvas>
  <div id="mapWin"></div>
</div>

<main id="kb"></main>

<div id="rotate" class="hint hidden">横向きにすると、鍵盤が広くなって弾きやすくなります <button id="rotateClose" aria-label="閉じる">×</button></div>

<div id="sheetBg" class="hidden"></div>

<section id="setSheet" class="sheet hidden" aria-label="設定">
  <h2>設定</h2>
  <div class="row"><span>音名の表示</span>
    <div class="seg" data-key="labels">
      <button data-v="doremi">ドレミ</button><button data-v="cde">CDE</button><button data-v="none">なし</button>
    </div>
  </div>
  <div class="row"><span>音色</span>
    <div class="seg" data-key="timbre">
      <button data-v="piano">ピアノ</button><button data-v="epiano">エレピ</button><button data-v="organ">オルガン</button>
    </div>
  </div>
  <div class="row"><span>音量</span><input id="volume" type="range" min="0" max="1" step="0.05"></div>
  <div class="row"><span>響き（ホールの残響）</span><input id="reverb" type="checkbox" class="sw"></div>
  <div class="row"><span>鍵盤の手前ほど強い音にする</span><input id="velocity" type="checkbox" class="sw"></div>
  <div class="row"><span>指をすべらせて弾く（グリッサンド）</span><input id="gliss" type="checkbox" class="sw"></div>
  <p class="ver">ピアノ v<span id="ver"></span></p>
</section>

<section id="listSheet" class="sheet hidden" aria-label="録音一覧">
  <h2>録音一覧</h2>
  <ul id="recList"></ul>
</section>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
