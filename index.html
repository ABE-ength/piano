<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7fd3ff">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>ピアノ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- アニメ風の背景 -->
  <svg id="scene" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#6ccaff"/><stop offset="1" stop-color="#d4f3ff"/>
      </linearGradient>
      <radialGradient id="sunG"><stop offset="0" stop-color="#fff2a8"/><stop offset="1" stop-color="#ffcf33"/></radialGradient>
    </defs>
    <rect width="1600" height="700" fill="url(#sky)"/>
    <g opacity=".55" fill="none" stroke-width="26">
      <circle cx="420" cy="620" r="420" stroke="#ff8a8a"/>
      <circle cx="420" cy="620" r="394" stroke="#ffc46b"/>
      <circle cx="420" cy="620" r="368" stroke="#fff27a"/>
      <circle cx="420" cy="620" r="342" stroke="#9ce88a"/>
      <circle cx="420" cy="620" r="316" stroke="#8fd0ff"/>
      <circle cx="420" cy="620" r="290" stroke="#b9a2ff"/>
    </g>
    <g class="cloud c1"><circle cx="0" cy="40" r="38"/><circle cx="45" cy="25" r="48"/><circle cx="100" cy="42" r="36"/><rect x="-30" y="40" width="160" height="38" rx="19"/></g>
    <g class="cloud c2"><circle cx="0" cy="40" r="30"/><circle cx="38" cy="22" r="40"/><circle cx="82" cy="40" r="30"/><rect x="-24" y="38" width="130" height="32" rx="16"/></g>
    <g class="cloud c3"><circle cx="0" cy="40" r="26"/><circle cx="32" cy="26" r="34"/><circle cx="70" cy="40" r="26"/><rect x="-20" y="38" width="112" height="28" rx="14"/></g>
    <path d="M0 520 Q300 400 650 500 T1300 470 T1600 480 V700 H0Z" fill="#9be38a"/>
    <path d="M0 580 Q400 500 800 570 T1600 540 V700 H0Z" fill="#74cf63"/>
    <g class="flowers">
      <circle cx="120" cy="560" r="10" fill="#ff7eb6"/><circle cx="260" cy="530" r="9" fill="#fff"/>
      <circle cx="1350" cy="520" r="10" fill="#ffe14d"/><circle cx="1480" cy="545" r="9" fill="#ff7eb6"/>
    </g>
  </svg>

  <!-- 上の帯 -->
  <header id="top">
    <div class="left">
      <button id="songBtn" class="pill big">🎵 <span data-i18n="songs">うた</span></button>
      <button id="stopBtn" class="pill big red hidden">⏹ <span data-i18n="stop">やめる</span></button>
      <div class="seg" id="modeSeg">
        <button data-v="wait">⭐ <span data-i18n="wait">まってね</span></button>
        <button data-v="along">🎶 <span data-i18n="along">いっしょに</span></button>
      </div>
      <div class="seg small" id="speedSeg">
        <button data-v="0.7" data-i18n-aria="slow" aria-label="ゆっくり">🐢</button>
        <button data-v="1" data-i18n-aria="normal" aria-label="ふつう">🚶</button>
        <button data-v="1.3" data-i18n-aria="fast" aria-label="はやい">🐇</button>
      </div>
    </div>
    <div id="now" class="hidden"><span id="nowEmoji"></span><span id="nowTitle"></span><div id="bar"><div id="barFill"></div><span id="barGoal">🏁</span><span id="barRunner"></span></div></div>
    <div class="right">
      <div id="buddy" aria-hidden="true">
        <svg viewBox="0 0 120 120">
          <circle cx="28" cy="30" r="18" fill="#c98b5a"/><circle cx="92" cy="30" r="18" fill="#c98b5a"/>
          <circle cx="28" cy="30" r="9" fill="#f0c49a"/><circle cx="92" cy="30" r="9" fill="#f0c49a"/>
          <circle cx="60" cy="66" r="46" fill="#d99a66"/>
          <ellipse cx="60" cy="82" rx="22" ry="17" fill="#f6dcc0"/>
          <g class="eyes"><ellipse cx="42" cy="60" rx="6" ry="8" fill="#3a2a20"/><ellipse cx="78" cy="60" rx="6" ry="8" fill="#3a2a20"/>
          <circle cx="44" cy="57" r="2.2" fill="#fff"/><circle cx="80" cy="57" r="2.2" fill="#fff"/></g>
          <ellipse cx="60" cy="75" rx="7" ry="5" fill="#3a2a20"/>
          <path d="M51 86 Q60 95 69 86" stroke="#3a2a20" stroke-width="3" fill="none" stroke-linecap="round"/>
          <circle cx="30" cy="78" r="7" fill="#ff9aa8" opacity=".7"/><circle cx="90" cy="78" r="7" fill="#ff9aa8" opacity=".7"/>
        </svg>
      </div>
      <div id="flags" role="group" aria-label="ことば / Language / 語言">
        <button class="flag" data-lang="en" aria-label="English">
          <svg viewBox="0 0 40 40"><defs><clipPath id="ce"><circle cx="20" cy="20" r="18"/></clipPath></defs>
            <g clip-path="url(#ce)"><rect width="40" height="40" fill="#fff"/>
              <g fill="#e8384f"><rect y="2" width="40" height="4"/><rect y="10" width="40" height="4"/><rect y="18" width="40" height="4"/><rect y="26" width="40" height="4"/><rect y="34" width="40" height="4"/></g>
              <rect width="20" height="22" fill="#3c5bd6"/>
              <g fill="#fff"><circle cx="5" cy="5" r="1.4"/><circle cx="11" cy="5" r="1.4"/><circle cx="17" cy="5" r="1.4"/><circle cx="8" cy="10" r="1.4"/><circle cx="14" cy="10" r="1.4"/><circle cx="5" cy="15" r="1.4"/><circle cx="11" cy="15" r="1.4"/><circle cx="17" cy="15" r="1.4"/></g></g>
            <circle cx="20" cy="20" r="18" fill="none" stroke="#dfe4f5" stroke-width="2"/>
            <circle cx="28" cy="10" r="2.5" fill="#fff" opacity=".8"/></svg>
        </button>
        <button class="flag" data-lang="ja" aria-label="にほんご">
          <svg viewBox="0 0 40 40"><defs><clipPath id="cj"><circle cx="20" cy="20" r="18"/></clipPath></defs>
            <g clip-path="url(#cj)"><rect width="40" height="40" fill="#fff"/><circle cx="20" cy="20" r="8" fill="#e8384f"/></g>
            <circle cx="20" cy="20" r="18" fill="none" stroke="#f1d9de" stroke-width="2"/>
            <circle cx="11" cy="11" r="3" fill="#fff" opacity=".9"/></svg>
        </button>
        <button class="flag" data-lang="zh" aria-label="中文（繁體）">
          <svg viewBox="0 0 40 40"><defs><radialGradient id="zg" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ff7b7b"/><stop offset="1" stop-color="#e8384f"/></radialGradient></defs>
            <circle cx="20" cy="20" r="18" fill="url(#zg)"/>
            <circle cx="20" cy="20" r="18" fill="none" stroke="#ffd84d" stroke-width="2.5"/>
            <text x="20" y="27.5" text-anchor="middle" font-size="21" font-weight="900" fill="#fff" font-family="sans-serif">中</text>
            <circle cx="11" cy="10" r="2.6" fill="#fff" opacity=".85"/></svg>
        </button>
      </div>
      <button id="setBtn" class="pill" aria-label="せってい（ながおし）">⚙</button>
    </div>
  </header>

  <div id="sun" role="button" aria-label="たいよう">
    <div class="glow"></div>
    <svg viewBox="0 0 100 100">
      <g class="raysWrap"><g class="rays" stroke="#ffcf33" stroke-width="6" stroke-linecap="round">
        <line x1="50" y1="2" x2="50" y2="14"/><line x1="50" y1="86" x2="50" y2="98"/><line x1="2" y1="50" x2="14" y2="50"/><line x1="86" y1="50" x2="98" y2="50"/>
        <line x1="16" y1="16" x2="24" y2="24"/><line x1="76" y1="76" x2="84" y2="84"/><line x1="84" y1="16" x2="76" y2="24"/><line x1="16" y1="84" x2="24" y2="76"/></g></g>
      <g class="face">
        <circle cx="50" cy="50" r="30" fill="url(#sunG)"/>
        <circle cx="33" cy="56" r="4.5" fill="#ff9a7a" opacity=".7" class="blush"/><circle cx="67" cy="56" r="4.5" fill="#ff9a7a" opacity=".7" class="blush"/>
        <!-- 目 -->
        <g class="e-normal"><circle cx="40" cy="46" r="4" fill="#6b4a1a"/><circle cx="60" cy="46" r="4" fill="#6b4a1a"/>
          <circle cx="41.3" cy="44.6" r="1.3" fill="#fff"/><circle cx="61.3" cy="44.6" r="1.3" fill="#fff"/></g>
        <g class="e-happy" stroke="#6b4a1a" stroke-width="3" fill="none" stroke-linecap="round"><path d="M35 47 Q40 41 45 47"/><path d="M55 47 Q60 41 65 47"/></g>
        <g class="e-wink"><circle cx="40" cy="46" r="4" fill="#6b4a1a"/><circle cx="41.3" cy="44.6" r="1.3" fill="#fff"/>
          <path d="M55 46 Q60 50 65 46" stroke="#6b4a1a" stroke-width="3" fill="none" stroke-linecap="round"/></g>
        <g class="e-wow"><circle cx="40" cy="45" r="5.5" fill="#fff" stroke="#6b4a1a" stroke-width="2"/><circle cx="60" cy="45" r="5.5" fill="#fff" stroke="#6b4a1a" stroke-width="2"/>
          <circle cx="40" cy="45" r="2.5" fill="#6b4a1a"/><circle cx="60" cy="45" r="2.5" fill="#6b4a1a"/></g>
        <g class="e-dizzy" stroke="#6b4a1a" stroke-width="2.2" fill="none" stroke-linecap="round">
          <path d="M40 46 m-4 0 a4 4 0 1 1 4 4 a2.5 2.5 0 1 1 -2 -3"/><path d="M60 46 m-4 0 a4 4 0 1 1 4 4 a2.5 2.5 0 1 1 -2 -3"/></g>
        <g class="e-cool"><rect x="31" y="40" width="16" height="10" rx="4" fill="#2b2b33"/><rect x="53" y="40" width="16" height="10" rx="4" fill="#2b2b33"/>
          <rect x="46" y="42" width="8" height="2.5" fill="#2b2b33"/><path d="M34 42 l5 0" stroke="#fff" stroke-width="1.5" opacity=".7"/><path d="M56 42 l5 0" stroke="#fff" stroke-width="1.5" opacity=".7"/></g>
        <!-- 口 -->
        <path class="m-smile" d="M40 58 Q50 67 60 58" stroke="#6b4a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
        <g class="m-laugh"><path d="M38 56 Q50 74 62 56 Z" fill="#8a3a2a" stroke="#6b4a1a" stroke-width="2" stroke-linejoin="round"/><path d="M43 64 Q50 69 57 64 Q50 61 43 64" fill="#ff7b8a"/></g>
        <ellipse class="m-wow" cx="50" cy="62" rx="5" ry="6.5" fill="#8a3a2a" stroke="#6b4a1a" stroke-width="2"/>
        <path class="m-wavy" d="M41 61 q3 -3 6 0 t6 0 t6 0" stroke="#6b4a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </g>
    </svg>
  </div>
  <div id="sunFx"></div>

  <!-- 鍵盤 -->
  <main id="kbWrap"><div id="kb"></div><div id="fx"></div></main>

  <!-- うたをえらぶ -->
  <div id="picker" class="overlay hidden">
    <div class="panel">
      <h2 data-i18n="pick">🎵 どの うたに する？</h2>
      <div id="songGrid"></div>
      <button class="close pill" data-close>✕</button>
    </div>
  </div>

  <!-- できたね -->
  <div id="done" class="overlay hidden">
    <div class="rays"></div>
    <div id="fireworks"></div>
    <div class="panel done">
      <div class="medal">🏅</div>
      <h2 id="doneTitle"></h2>
      <p id="doneSong"></p>
      <p class="stamps">🌟 <span data-i18n="stamps">スタンプ</span> × <b id="stampCount">0</b></p>
      <div class="row">
        <button id="againBtn" class="pill big">🔁 <span data-i18n="again">もういちど</span></button>
        <button id="otherBtn" class="pill big">🎵 <span data-i18n="other">ほかの うた</span></button>
        <button class="pill big" data-close>🎹 <span data-i18n="free">じゆうに ひく</span></button>
      </div>
    </div>
    <div id="confetti"></div>
  </div>

  <!-- おとな用のせってい（⚙をながおし） -->
  <div id="settings" class="overlay hidden">
    <div class="panel sheet">
      <h2 data-i18n="settings">せってい（おとなよう）</h2>
      <div class="line vol"><span data-i18n="volume">音量</span>
        <div class="volBox"><span class="vi">🔈</span>
          <div id="volSlider" role="slider" aria-valuemin="10" aria-valuemax="100" tabindex="0">
            <div id="volFill"></div><div id="volKnob"></div>
          </div><span class="vi">🔊</span></div></div>
      <label class="line"><span data-i18n="labels">鍵盤に ドレミ を表示</span><input id="labels" type="checkbox"></label>
      <label class="line"><span data-i18n="guide">「いっしょに」でお手本の音を鳴らす</span><input id="guide" type="checkbox"></label>
      <p class="note" data-i18n-html="help"></p>
      <p class="credit"><span data-i18n="soundby">ピアノの音</span>：Salamander Grand Piano V3（Alexander Holm, CC BY 3.0）<br>ピアノ v<span id="ver"></span></p>
      <button class="pill big" data-close data-i18n="close">とじる</button>
    </div>
  </div>

  <div id="loading"><div>🎹</div><p data-i18n="loading">じゅんび ちゅう…</p></div>
  <div id="toast"></div>
</div>
<script src="app.js"></script>
</body>
</html>
